<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 互联网打印</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f4f6f8; color: #17202a; padding: 24px;
    }
    .card {
      width: 100%; max-width: 380px; background: #fff; border-radius: 18px;
      padding: 28px; box-shadow: 0 12px 40px rgba(20, 40, 70, .12);
    }
    h1 { font-size: 22px; margin: 0 0 6px; }
    p.sub { margin: 0 0 22px; color: #667085; font-size: 14px; }
    label { display: block; font-size: 13px; color: #475467; margin-bottom: 8px; }
    input[type=password] {
      width: 100%; padding: 13px 14px; font-size: 16px; border: 1px solid #d0d5dd;
      border-radius: 11px; outline: none; background: #fff; color: #101828;
    }
    input[type=password]:focus { border-color: #2e90fa; box-shadow: 0 0 0 3px rgba(46,144,250,.15); }
    button {
      width: 100%; margin-top: 16px; padding: 13px; border: 0; border-radius: 11px;
      background: #1570ef; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #175cd3; }
    .error { background: #fef3f2; color: #b42318; padding: 10px 12px; border-radius: 9px; font-size: 14px; margin-bottom: 14px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>互联网打印</h1>
    <p class="sub">输入访问密码后上传文件，打印机会自动出纸。</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="login" autocomplete="current-password">
      <label for="password">访问密码</label>
      <input id="password" name="password" type="password" required autofocus>
      <button type="submit">进入</button>
    </form>
  </main>
</body>
</html>
